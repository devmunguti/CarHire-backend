      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/StaffMember' }
    StaffListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [items, nextCursor]
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/StaffMember' }
                nextCursor: { type: [string, 'null'] }
    InvitationEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [id, email, role, expiresAt]
              properties:
                id: { type: string }
                email: { type: string, format: email }
                role: { $ref: '#/components/schemas/UserRole' }
                expiresAt: { type: string, format: date-time }
    AuditListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [items, nextCursor]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [id, actor, action, entity, createdAt]
                    properties:
                      id: { type: string }
                      actorId: { type: string }
                      actor: { type: string }
                      action: { type: string }
                      entity: { type: string }
                      requestId: { type: string }
                      createdAt: { type: string, format: date-time }
                      before: { type: object, additionalProperties: true }
                      after: { type: object, additionalProperties: true }
                nextCursor: { type: [string, 'null'] }
    UploadEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri-reference }
