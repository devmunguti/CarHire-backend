      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [pendingApprovals, openIncidents]
              properties:
                pendingApprovals: { type: integer, minimum: 0 }
                openIncidents: { type: integer, minimum: 0 }
    SearchResultsEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                type: object
                required: [id, type, title, subtitle, href]
                properties:
                  id: { type: string }
                  type: { type: string, enum: [vehicle, booking, customer] }
                  title: { type: string }
                  subtitle: { type: string }
                  href: { type: string }
    StaffInvitationRequest:
      type: object
