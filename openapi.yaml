            languages:
              type: array
              minItems: 1
              maxItems: 10
              items: { type: string, minLength: 1, maxLength: 40 }
            licenceClass: { type: string, minLength: 1, maxLength: 20 }
            licenceExpiresAt: { type: string, format: date-time }
            psvExpiresAt: { type: string, format: date-time }
    StaffMember:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [branch, active]
          properties:
            branch: { type: string }
            active: { type: boolean }
