              type: array
              items: { $ref: '#/components/schemas/BookingPayment' }
    GuestBookingSummaryEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/GuestBookingSummary' }
    CancellationEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [cancelled]
              properties:
                cancelled: { const: true }
    HandoverRequest:
      type: object
      required: [odometer, fuelLevel, notes, photos, signatureConfirmed, criticalDefect]
      properties:
        odometer: { type: integer, minimum: 0 }
        fuelLevel: { type: string, enum: [empty, quarter, half, three_quarters, full] }
        notes: { type: string, maxLength: 1000 }
        photos:
          type: array
          maxItems: 10
          items: { type: string, format: uri-reference }
        signatureConfirmed: { const: true }
        criticalDefect: { type: boolean }
    Settlement:
      type: object
      required: [graceHours, lateHours, lateFeeKes, odometerDifferenceKm, includedMileageKm, excessMileageKm, excessMileageRateKes, excessMileageChargeKes, totalKes]
      properties:
        graceHours: { type: number, minimum: 0 }
        lateHours: { type: number, minimum: 0 }
        lateFeeKes: { type: integer, minimum: 0 }
        odometerDifferenceKm: { type: integer, minimum: 0 }
        includedMileageKm: { type: integer, minimum: 0 }
        excessMileageKm: { type: integer, minimum: 0 }
        excessMileageRateKes: { type: integer, minimum: 0 }
        excessMileageChargeKes: { type: integer, minimum: 0 }
        totalKes: { type: integer, minimum: 0 }
    SettlementEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Settlement' }
    StkInitiationEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [paymentId, maskedPhone]
              properties:
                paymentId: { type: string }
                maskedPhone: { type: string }
    StkStatusEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [outcome, amountDueKes]
              properties:
                outcome: { type: string, enum: [pending, confirmed, failed, manual_refund] }
                amountDueKes: { type: integer, minimum: 0 }
                paidAmountKes: { type: integer, minimum: 0 }
                message: { type: string }
    Driver:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [status, languages, licenceClass, licenceExpiresAt, psvExpiresAt, rating]
          properties:
            role: { const: driver }
            status: { type: string, enum: [available, assigned, off_duty] }
            languages:
              type: array
              items: { type: string }
            licenceClass: { type: string }
            licenceExpiresAt: { type: string, format: date-time }
            psvExpiresAt: { type: string, format: date-time }
            rating: { type: number, minimum: 0, maximum: 5 }
    DriverListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [items, nextCursor]
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/Driver' }
                nextCursor: { type: [string, 'null'] }
    AvailableDriversEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [drivers, autoAssignDriverId]
              properties:
                drivers:
                  type: array
                  items: { $ref: '#/components/schemas/Driver' }
                autoAssignDriverId:
                  type: [string, 'null']
    GeoJsonPoint:
      type: object
      required: [type, coordinates]
      properties:
        type: { const: Point }
        coordinates:
          type: array
          prefixItems:
            - type: number
              description: Longitude
            - type: number
              description: Latitude
          minItems: 2
          maxItems: 2
    Mechanic:
      type: object
      required: [id, name, phone, whatsapp, county, town, type, specialties, callOutRateKes, location]
      properties:
        id: { type: string }
        name: { type: string }
        phone: { type: string }
        whatsapp: { type: string }
        county: { type: string }
        town: { type: string }
        type: { type: string, enum: [in_house, partner_garage, towing] }
        specialties:
          type: array
          items: { $ref: '#/components/schemas/IncidentCategory' }
        callOutRateKes: { type: integer, minimum: 0 }
        location: { $ref: '#/components/schemas/GeoJsonPoint' }
    MechanicInput:
      type: object
      required: [name, phone, whatsapp, county, town, type, specialties, callOutRateKes, location]
      properties:
        name: { type: string, minLength: 1 }
        phone: { type: string, minLength: 1 }
        whatsapp: { type: string, minLength: 1 }
        county: { type: string, minLength: 1 }
        town: { type: string, minLength: 1 }
        type: { type: string, enum: [in_house, partner_garage, towing] }
        specialties:
          type: array
          items: { $ref: '#/components/schemas/IncidentCategory' }
        callOutRateKes: { type: integer, minimum: 0 }
        location: { $ref: '#/components/schemas/GeoJsonPoint' }
    MechanicEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Mechanic' }
    MechanicListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [items, nextCursor]
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/Mechanic' }
                nextCursor: { type: [string, 'null'] }
    NearbyMechanicListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/Mechanic'
                  - type: object
                    required: [distanceKm]
                    properties:
                      distanceKm: { type: number, minimum: 0 }
    IncidentCategory:
      type: string
      enum: [flat_tyre, battery, overheating, accident, strange_noise]
    IncidentDispatchType:
      type: string
      enum: [closest_partner, in_house_rescue, replacement_vehicle]
    Incident:
      type: object
      required: [id, reference, status, description, createdAt, category, location, locationText, immobilising, photos, source]
      properties:
        id: { type: string }
        reference: { type: string }
        status: { type: string, enum: [open, awaiting_replacement, dispatched, resolved] }
        description: { type: string }
        createdAt: { type: string, format: date-time }
        category: { $ref: '#/components/schemas/IncidentCategory' }
        location: { $ref: '#/components/schemas/GeoJsonPoint' }
        locationText: { type: string }
        vehicleId: { type: string }
        immobilising: { type: boolean }
        photos:
          type: array
          items: { type: string, format: uri-reference }
        source: { type: string, enum: [driver, customer, desk] }
        dispatch:
          type: object
          properties:
            type: { $ref: '#/components/schemas/IncidentDispatchType' }
            mechanicId: { type: string }
            vehicleId: { type: string }
            createdAt: { type: string, format: date-time }
        resolution: { type: string }
    IncidentCreateRequest:
      type: object
      required: [category, description, location, locationText, immobilising]
      properties:
        category: { $ref: '#/components/schemas/IncidentCategory' }
        description: { type: string, minLength: 1, maxLength: 3000 }
        location:
          type: string
          description: GeoJSON Point serialized as JSON in the multipart field.
        locationText: { type: string, minLength: 1, maxLength: 300 }
        vehicleId: { type: string }
        immobilising: { type: string, enum: ['true', 'false'] }
        photos:
          type: array
          maxItems: 10
          description: Multipart photos; JPEG, PNG, or WebP, maximum 5 MiB per file.
          items: { type: string, format: binary, description: Image up to 5 MiB. }
    IncidentEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Incident' }
    IncidentListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [items, nextCursor]
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/Incident' }
                nextCursor: { type: [string, 'null'] }
    DashboardEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [metrics, pickups, returns, fleetStatus, recentActivity]
              properties:
                metrics:
                  type: object
                  additionalProperties: { type: [integer, 'null'] }
                  properties:
                    vehiclesOutToday: { type: [integer, 'null'] }
                    pickupsDueToday: { type: [integer, 'null'] }
                    returnsDueToday: { type: [integer, 'null'] }
                    overdueVehicles: { type: [integer, 'null'] }
                    pendingApprovals: { type: [integer, 'null'] }
                    activeBreakdowns: { type: [integer, 'null'] }
                    monthlyRevenue: { type: [integer, 'null'] }
                cardErrors:
                  type: object
                  additionalProperties: { type: string }
                pickups:
                  type: array
                  items: { $ref: '#/components/schemas/Booking' }
                returns:
                  type: array
                  items: { $ref: '#/components/schemas/Booking' }
                fleetStatus:
                  type: object
                  required: [available, rented, reserved, maintenance]
                  properties:
                    available: { type: integer, minimum: 0 }
                    rented: { type: integer, minimum: 0 }
                    reserved: { type: integer, minimum: 0 }
                    maintenance: { type: integer, minimum: 0 }
                recentActivity:
                  type: array
                  items:
                    type: object
                    required: [id, kind, reference, timestamp]
                    properties:
                      id: { type: string }
                      kind: { type: string, enum: [booking, handover, incident] }
                      reference: { type: string }
                      timestamp: { type: string, format: date-time }
